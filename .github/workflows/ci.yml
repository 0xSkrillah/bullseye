name: ci

# Everything here runs offline against recorded data, the fixture synthesiser and the fixture
# payment rail. No secret is read, no model is called and no funds can move.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor in package.json (node:sqlite); 24 is what the Dockerfile ships
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # build first: apps/api/test/public-deployment.test.ts skips itself when apps/web/dist is
      # absent, so running the suite before the build silently drops the test that covers serving
      # index.html for a deep link. That is the /?brief= route, so the skip hid the most
      # release-critical path in the product on every run this workflow has ever made.
      - run: npm run build
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
